name: Scheduled Automation

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run Scheduled Report Bot
        run: uv run main.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit generated files
        run: |
          git config user.name "samanamaa"
          git config user.email "simon.placko6@gmail.com"

          git add reports/report.txt
          git add data/snapshot.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily scheduled report"
            git push
          fi

      - name: Upload snapshot.json to Discord
        if: success()
        run: |
          curl \
            -F "file1=@data/snapshot.json" \
            -F 'payload_json={"content":"Workflow snapshot"}' \
            ${{ secrets.DISCORD_WEBHOOK_REPORT }}