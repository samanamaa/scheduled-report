name: Scheduled automation
on:
    schedule:
        -   cron: "0 8 * * *" # every day at 08:00 UTC
    workflow_dispatch: # also lets you run it manually
jobs:
    run:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: astral-sh/setup-uv@v5
            -   run: uv run main.py